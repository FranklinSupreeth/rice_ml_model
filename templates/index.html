<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rice Prediction Model</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --husk: #F4EDE0;
            --paper: #FBF7EF;
            --ink: #2B2620;
            --bran: #6B4226;
            --grain: #C98A3F;
            --paddy: #6E7F5C;
            --copper: #B5651D;
            --line: rgba(43, 38, 32, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            background-color: var(--husk);
            background-image:
                radial-gradient(circle at 1px 1px, rgba(107, 66, 38, 0.10) 1px, transparent 0);
            background-size: 22px 22px;
            min-height: 100vh;
        }

        .field {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .silo {
            width: 100%;
            max-width: 480px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 30px 60px -25px rgba(43, 38, 32, 0.35);
            overflow: hidden;
        }

        .silo-head {
            padding: 34px 36px 22px;
            border-bottom: 1px solid var(--line);
            position: relative;
        }

        .eyebrow {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--paddy);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .eyebrow svg {
            flex-shrink: 0;
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 30px;
            line-height: 1.15;
            margin: 0;
            color: var(--ink);
        }

        h1 span {
            color: var(--copper);
            font-style: italic;
            font-weight: 500;
        }

        .sub {
            margin: 10px 0 0;
            font-size: 14px;
            color: rgba(43, 38, 32, 0.62);
            line-height: 1.5;
        }

        form {
            padding: 28px 36px 34px;
        }

        .dropzone {
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1.5px dashed rgba(107, 66, 38, 0.35);
            border-radius: 14px;
            background: repeating-linear-gradient(135deg,
                    rgba(201, 138, 63, 0.05),
                    rgba(201, 138, 63, 0.05) 10px,
                    transparent 10px,
                    transparent 20px);
            padding: 26px 20px;
            text-align: center;
            transition: border-color .2s ease, background .2s ease;
        }

        .dropzone:hover,
        .dropzone.active {
            border-color: var(--copper);
        }

        .grain-icon {
            margin-bottom: 12px;
        }

        .dz-label {
            font-size: 13.5px;
            color: var(--ink);
            font-weight: 500;
        }

        .dz-hint {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: rgba(43, 38, 32, 0.5);
            margin-top: 5px;
        }

        input[type=file] {
            display: block;
            width: 100%;
            max-width: 260px;
            margin: 18px auto 0;
            font-family: 'Inter', sans-serif;
            font-size: 12.5px;
        }

        #filename {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            color: var(--paddy);
            margin-top: 10px;
            min-height: 14px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            background: var(--ink);
            color: var(--paper);
            border: none;
            padding: 15px 25px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14.5px;
            letter-spacing: 0.01em;
            border-radius: 9px;
            transition: background .18s ease, transform .18s ease;
        }

        button:hover {
            background: var(--copper);
        }

        button:active {
            transform: scale(0.98);
        }

        button:focus-visible,
        .dropzone:focus-within {
            outline: 2px solid var(--copper);
            outline-offset: 2px;
        }

        .result {
            margin: 8px 36px 34px;
            padding-top: 26px;
            border-top: 1px solid var(--line);
        }

        .result-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--paddy);
            margin-bottom: 14px;
        }

        .result-body {
            display: flex;
            gap: 18px;
            align-items: flex-start;
        }

        .result img {
            width: 96px;
            height: 96px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--line);
            flex-shrink: 0;
        }

        .result-data {
            flex: 1;
            min-width: 0;
        }

        .type-name {
            font-family: 'Fraunces', serif;
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 10px;
            color: var(--ink);
        }

        .confidence-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .confidence-track {
            flex: 1;
            height: 8px;
            background: rgba(107, 66, 38, 0.12);
            border-radius: 6px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--grain), var(--copper));
            border-radius: 6px;
        }

        .confidence-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--bran);
            white-space: nowrap;
        }

        @media (max-width: 500px) {

            .silo-head,
            form,
            .result {
                padding-left: 24px;
                padding-right: 24px;
            }

            .result-body {
                flex-direction: column;
            }

            .result img {
                width: 100%;
                height: 160px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            button,
            .dropzone {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <div class="field">
        <div class="silo">

            <div class="silo-head">
                <div class="eyebrow">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                        <ellipse cx="7" cy="7" rx="3" ry="6" transform="rotate(20 7 7)" fill="#B5651D" />
                    </svg>
                    Grain Vision Model
                </div>
                <h1>Rice <span>Prediction</span> Model</h1>
                <p class="sub">Upload a grain sample. The model classifies the variety and reports its confidence.</p>
            </div>

            <form action="/predict" method="POST" enctype="multipart/form-data">

                <label class="dropzone" for="image-input" id="dropzone">
                    <svg class="grain-icon" width="42" height="26" viewBox="0 0 42 26" fill="none">
                        <ellipse cx="10" cy="18" rx="3.2" ry="7.5" transform="rotate(-14 10 18)" fill="#C98A3F" />
                        <ellipse cx="21" cy="10" rx="3.2" ry="7.5" transform="rotate(-6 21 10)" fill="#6B4226" />
                        <ellipse cx="32" cy="17" rx="3.2" ry="7.5" transform="rotate(10 32 17)" fill="#C98A3F" />
                    </svg>
                    <div class="dz-label">Click to choose a rice grain image</div>
                    <div class="dz-hint">JPG · PNG — single grain or sample</div>
                    <input id="image-input" type="file" name="image" accept="image/*" required>
                    <div id="filename"></div>
                </label>

                <button type="submit">Classify Grain</button>

            </form>

            {% if prediction %}
            <div class="result">
                <div class="result-label">Prediction</div>
                <div class="result-body">
                    <img src="{{image}}" alt="Uploaded rice grain sample">
                    <div class="result-data">
                        <p class="type-name">{{prediction}}</p>
                        <div class="confidence-row">
                            <div class="confidence-track">
                                <div class="confidence-fill" style="width: {{confidence}}%;"></div>
                            </div>
                            <span class="confidence-value">{{confidence}}%</span>
                        </div>
                    </div>
                </div>
            </div>
            {% endif %}

        </div>
    </div>

    <script>
        const input = document.getElementById('image-input');
        const filename = document.getElementById('filename');
        const dropzone = document.getElementById('dropzone');

        input.addEventListener('change', () => {
            if (input.files && input.files[0]) {
                filename.textContent = input.files[0].name;
                dropzone.classList.add('active');
            } else {
                filename.textContent = '';
                dropzone.classList.remove('active');
            }
        });
    </script>

</body>

</html>
